<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
    <style>
        .done {
          text-decoration: line-through;
          color: gray;
        }
      </style>
      
</head>
<body>
    <input type="text" id="taskInput" placeholder="Enter a task"></input>
    <button id="addTaskBtn">Add task</button>
    <ul id="taskList"></ul>

    <script>

let tasks = [];


        const inputBox = document.getElementById("taskInput");
        const addButton = document.getElementById("addTaskBtn");
        const taskList = document.getElementById("taskList");

        addButton.addEventListener("click", function() {
  const task = inputBox.value;

  tasks.push(task); // Add to array

// Save updated tasks to localStorage
localStorage.setItem("tasks", JSON.stringify(tasks));


            // 1. Create a new list item
            const li = document.createElement("li");

            // 2. Add the task text inside it
            li.innerText = task;

            // 3. Add the new <li> to the <ul>
            taskList.appendChild(li);

            // 4. Clear the input box after adding
            inputBox.value = "";

            // Make the task clickable to mark as done
            li.addEventListener("click", function() {
            li.classList.toggle("done");
            });

                    // 1. Create delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.innerText = "❌";
        deleteBtn.style.marginLeft = "8px";

        // 2. Add click listener to delete the task
        deleteBtn.addEventListener("click", function() {
        taskList.removeChild(li);
        });

        // 3. Add delete button to the task item
        li.appendChild(deleteBtn);

        inputBox.addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault(); // ✅ stop default Enter behavior
    addButton.click();      // 👆 pretend the button was clicked
  }
});







});

window.addEventListener("load", function() {
  const storedTasks = JSON.parse(localStorage.getItem("tasks")) || [];

  tasks = storedTasks; // set global array

  storedTasks.forEach(function(task) {
    const li = document.createElement("li");
    li.innerText = task;

    li.addEventListener("click", function() {
      li.classList.toggle("done");
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.innerText = "❌";
    deleteBtn.style.marginLeft = "10px";
    deleteBtn.addEventListener("click", function() {
      taskList.removeChild(li);

      // Remove from tasks array and resave
      tasks = tasks.filter(t => t !== task);
      localStorage.setItem("tasks", JSON.stringify(tasks));
    });

    li.appendChild(deleteBtn);
    taskList.appendChild(li);
  });
});


     

    
    </script>
</body>
</html>
